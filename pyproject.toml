[project]
name = "casmi-flyte-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flyte>=2.10.0",
    "pyarrow>=17",
    "numpy>=2",
    "polars>=1.30",
    "torch>=2.14.0",
    "chemprop>=2.3.1",
    "jpype1>=1.7.1",
    "mordred>=0.6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casmi_flyte"]
